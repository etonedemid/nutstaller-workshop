# A blueprint submitted through the issue form: validated and published by
# tools/workshop.py, then the issue is answered and closed.
name: Publish blueprint
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: publish   # one at a time: each run rewrites index.json
  cancel-in-progress: false
jobs:
  publish:
    if: contains(github.event.issue.labels.*.name, 'blueprint')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if python3 tools/workshop.py submit; then echo "ok=1" >> "$GITHUB_OUTPUT"; fi
      - name: Commit
        if: steps.publish.outputs.ok == '1'
        run: |
          git config user.name "workshop-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blueprints index.json
          git commit -m "Add blueprint from #${{ github.event.issue.number }}"
          git pull --rebase
          git push
      - name: Reply and close
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          [ -f reply.md ] || echo "Something went wrong while publishing; a maintainer will take a look." > reply.md
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file reply.md
          if grep -q '^Published' reply.md; then
            gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed
          else
            gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason "not planned"
          fi
