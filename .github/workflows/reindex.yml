# A maintainer removed or edited blueprints by hand: index.json follows.
name: Rebuild index
on:
  push:
    branches: [main]
    paths: ["blueprints/**", "tools/workshop.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/workshop.py test && python3 tools/workshop.py index
      - run: |
          git diff --quiet index.json && exit 0
          git config user.name "workshop-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Rebuild index"
          git push
