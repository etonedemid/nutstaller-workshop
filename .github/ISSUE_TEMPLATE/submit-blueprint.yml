name: Submit a blueprint
description: Share a Nuts & Bolts vehicle. Use NutStaller's Workshop page to make the submission.
title: "Blueprint: "
labels: [blueprint]
body:
  - type: markdown
    attributes:
      value: |
        In NutStaller open **Workshop**, then **Share** and **Vehicle**: pick the vehicle, name it, add a short description and a screenshot, then press **Copy and open GitHub**. Paste below and submit.
        A bot publishes it within a minute (at most 3 blueprints per 10 minutes per account).
  - type: textarea
    id: submission
    attributes:
      label: Submission
      description: Paste what NutStaller copied.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: rights
    attributes:
      label: Sharing
      options:
        - label: I built this vehicle or have the builder's permission to share it.
          required: true
